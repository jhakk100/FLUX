<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haru — 개인 AI 오케스트레이터</title>
    <style>
      :root { color-scheme: dark; --bg: #10131b; --panel: #181d28; --border: #2b3343; --text: #e8edf6; --muted: #9ca9bd; --accent: #8bb8ff; --danger: #ff9a9a; }
      * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      button, input, textarea, select { font: inherit; } button { border: 0; border-radius: 8px; padding: 8px 12px; background: #3267ba; color: white; cursor: pointer; } button.secondary { background: #30394a; } button.danger { background: #a53c48; }
      input, textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: #0d1119; color: var(--text); padding: 9px; }
      main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 310px; min-height: 100vh; } aside, section { border-right: 1px solid var(--border); } aside { padding: 16px; background: #141925; } section { padding: 16px; min-width: 0; }
      h1, h2, h3, p { margin-top: 0; } h1 { font-size: 20px; } h2 { font-size: 15px; } .muted { color: var(--muted); } .row { display: flex; gap: 8px; align-items: center; } .row > * { min-width: 0; }
      .sessions { display: grid; gap: 6px; margin-top: 12px; } .session { width: 100%; text-align: left; background: transparent; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .session.active { background: #263a5a; }
      .chat { height: calc(100vh - 136px); overflow: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 18px; } .message { max-width: 82%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); } .message.user { align-self: end; background: #244d8d; } .message.assistant { align-self: start; }
      .composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; } .composer textarea { min-height: 58px; resize: vertical; } .card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--panel); } .risk { color: var(--danger); font-weight: 700; } pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
      dialog { max-width: 560px; width: calc(100% - 32px); background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; } dialog::backdrop { background: #000a; }
      @media (max-width: 850px) { main { grid-template-columns: 210px minmax(0, 1fr); } main > aside:last-child { display: none; } }
      @media (max-width: 600px) { main { display: block; } main > aside:first-child { min-height: auto; border-bottom: 1px solid var(--border); } .chat { height: 58vh; } }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <div class="row" style="justify-content:space-between"><h1>Haru</h1><button id="new-session">새 대화</button></div>
        <p id="provider-status" class="muted">연결 상태 확인 중…</p>
        <div id="sessions" class="sessions"></div>
        <hr />
        <button id="new-project" class="secondary">프로젝트 추가</button>
      </aside>
      <section>
        <div class="row" style="justify-content:space-between"><h2 id="session-title">대화 선택</h2><span class="muted">로컬 전용 Gateway</span></div>
        <div id="chat" class="chat"><p class="muted">왼쪽에서 대화를 만들거나 선택하세요.</p></div>
        <form id="composer" class="composer"><textarea id="message" placeholder="메시지를 입력하세요. Enter로 전송, Shift+Enter로 줄바꿈" disabled></textarea><button id="send" disabled>전송</button></form>
      </section>
      <aside>
        <h2>승인함</h2><p class="muted">파일 변경·삭제 등은 여기서 직접 승인해야 실행됩니다.</p><div id="approvals"></div>
        <h2 style="margin-top:24px">최근 기록</h2><div id="audit" class="muted"></div>
      </aside>
    </main>
    <dialog id="project-dialog"><form method="dialog"><h2>프로젝트 추가</h2><label>이름<input id="project-name" value="내 프로젝트" required /></label><br /><label>작업 폴더 경로<input id="project-path" placeholder="C:\\work\\my-project" required /></label><br /><div class="row" style="justify-content:end"><button value="cancel" class="secondary">취소</button><button id="save-project" value="default">추가</button></div></form></dialog>
    <script>
      const state = { sessions: [], activeSession: null };
      let gatewayToken = sessionStorage.getItem("haru-gateway-token") || "";
      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (text) => text.replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char]);
      async function api(path, options = {}) { const response = await fetch(path, { headers: { "content-type": "application/json", ...(gatewayToken ? { authorization: `Bearer ${gatewayToken}` } : {}), ...(options.headers || {}) }, ...options }); if (response.status === 401 && !gatewayToken) { gatewayToken = prompt("Gateway 토큰을 입력하세요. 이 값은 이 브라우저 탭에만 보관됩니다.") || ""; if (gatewayToken) { sessionStorage.setItem("haru-gateway-token", gatewayToken); return api(path, options); } } if (!response.ok) throw new Error((await response.json()).error || "요청에 실패했습니다."); return response; }
      function renderSessions() { $("#sessions").innerHTML = state.sessions.map((session) => `<button class="session ${session.id === state.activeSession?.id ? "active" : ""}" data-session="${session.id}">${escapeHtml(session.title)}</button>`).join(""); document.querySelectorAll("[data-session]").forEach((button) => button.addEventListener("click", () => selectSession(button.dataset.session))); }
      function renderMessages(messages) { const chat = $("#chat"); chat.innerHTML = messages.map((message) => `<article class="message ${message.role}">${escapeHtml(message.content)}</article>`).join(""); chat.scrollTop = chat.scrollHeight; }
      async function selectSession(id) { state.activeSession = state.sessions.find((session) => session.id === id); $("#session-title").textContent = state.activeSession.title; $("#message").disabled = $("#send").disabled = false; renderSessions(); renderMessages(await (await api(`/api/sessions/${id}/messages`)).json()); }
      function renderApprovals(approvals) { $("#approvals").innerHTML = approvals.filter((item) => item.status === "pending").map((item) => `<div class="card"><strong class="risk">${item.risk} · ${escapeHtml(item.action)}</strong><p>${escapeHtml(item.target)}</p><pre>${escapeHtml(item.preview)}</pre><div class="row"><button data-approve="${item.id}">승인</button><button class="danger" data-reject="${item.id}">거절</button></div></div>`).join("") || '<p class="muted">대기 중인 요청 없음</p>';
        document.querySelectorAll("[data-reject]").forEach((button) => button.onclick = () => decide(button.dataset.reject, "rejected"));
        document.querySelectorAll("[data-approve]").forEach((button) => button.onclick = async () => { const item = approvals.find((approval) => approval.id === button.dataset.approve); const confirmation = item.risk === "R3" ? prompt(`파괴적 작업입니다. 정확한 대상 경로를 입력하세요:\n${item.target}`) : ""; if (item.risk === "R3" && confirmation === null) return; await decide(item.id, "approved", confirmation); }); }
      async function decide(id, decision, confirmTarget) { try { await api(`/api/approvals/${id}/decision`, { method: "POST", body: JSON.stringify({ decision, confirmTarget }) }); await refresh(); } catch (error) { alert(error.message); } }
      async function refresh() { const overview = await (await api("/api/overview")).json(); state.sessions = overview.sessions; $("#provider-status").textContent = `${overview.provider.provider} · ${overview.provider.configured ? "준비됨" : "설정 필요"}${overview.provider.model ? ` · ${overview.provider.model}` : ""}`; renderSessions(); renderApprovals(overview.approvals); $("#audit").innerHTML = overview.audit.slice(0, 5).map((entry) => `<div>${escapeHtml(entry.eventType)}<br /><small>${new Date(entry.createdAt).toLocaleString()}</small></div>`).join("<hr />"); if (state.activeSession) await selectSession(state.activeSession.id); }
      $("#new-session").onclick = async () => { const title = prompt("대화 이름", "새 대화"); if (title === null) return; const session = await (await api("/api/sessions", { method: "POST", body: JSON.stringify({ title }) })).json(); await refresh(); await selectSession(session.id); };
      $("#new-project").onclick = () => $("#project-dialog").showModal();
      $("#save-project").onclick = async (event) => { event.preventDefault(); try { await api("/api/projects", { method: "POST", body: JSON.stringify({ name: $("#project-name").value, workspacePath: $("#project-path").value }) }); $("#project-dialog").close(); await refresh(); } catch (error) { alert(error.message); } };
      $("#composer").onsubmit = async (event) => { event.preventDefault(); const content = $("#message").value.trim(); if (!content || !state.activeSession) return; $("#message").value = ""; const chat = $("#chat"); chat.insertAdjacentHTML("beforeend", `<article class="message user">${escapeHtml(content)}</article><article class="message assistant" id="streaming"></article>`); const streaming = $("#streaming"); chat.scrollTop = chat.scrollHeight; try { let response = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json", ...(gatewayToken ? { authorization: `Bearer ${gatewayToken}` } : {}) }, body: JSON.stringify({ sessionId: state.activeSession.id, content }) }); if (response.status === 401 && !gatewayToken) { gatewayToken = prompt("Gateway 토큰을 입력하세요. 이 값은 이 브라우저 탭에만 보관됩니다.") || ""; if (gatewayToken) { sessionStorage.setItem("haru-gateway-token", gatewayToken); response = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json", authorization: `Bearer ${gatewayToken}` }, body: JSON.stringify({ sessionId: state.activeSession.id, content }) }); } } if (!response.ok) throw new Error((await response.json()).error || "채팅 요청에 실패했습니다."); const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = ""; while (true) { const { done, value } = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), { stream: !done }); const events = buffer.split("\n\n"); buffer = events.pop() || ""; for (const raw of events) { const name = raw.match(/^event:\s*(.+)$/m)?.[1]; const data = raw.match(/^data:\s*(.+)$/m)?.[1]; if (!data) continue; const payload = JSON.parse(data); if (name === "delta") streaming.textContent += payload.text; if (name === "error") streaming.textContent = `오류: ${payload.error}`; } if (done) break; } } catch (error) { streaming.textContent = `오류: ${error.message}`; } await refresh(); };
      $("#message").onkeydown = (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("#composer").requestSubmit(); } };
      refresh().catch((error) => { $("#provider-status").textContent = `Gateway 연결 실패: ${error.message}`; });
    </script>
  </body>
</html>
